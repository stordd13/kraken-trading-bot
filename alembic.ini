# Alembic Configuration File
# =============================================================================
# KrakenBot Database Migrations
# =============================================================================

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run environment during config parsing
prepend_sys_path = .

# Set to "true" to run 'revision' with timestamp prefixes
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without source files
sourceless = false

# Version file location (defaults to within migrations dir)
version_locations = %(here)s/alembic/versions

# Version path separator (OS specific by default)
# version_path_separator = :

# Set to 'true' to search source files recursively in each "version_locations" directory
# recursive_version_locations = false

# The output encoding used when revision files
output_encoding = utf-8

# DATABASE URL
# This will be overridden by env.py to use the environment variable
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Format using ruff after generating migration files
# Uncomment below lines if you have ruff installed
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
