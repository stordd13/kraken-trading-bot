# Multi-Strategy Configuration
# If this file exists and enabled: true, the bot runs in multi-strategy mode.
# If this file is missing or enabled: false, the bot runs in legacy single-strategy mode.

enabled: true

# Global limits (across ALL strategies combined)
global_max_open_positions: 20
global_daily_loss_limit_eur: 50.0
global_max_portfolio_exposure_pct: 90.0

strategies:
  # === ACTIVES ===
  - name: grid_spot
    enabled: true
    bot_id: grid_spot_prod
    budget:
      max_open_positions: 15
      daily_loss_limit_eur: 15.0
      max_position_pct: 40.0
      position_size_multiplier: 1.0
    dashboard:
      exit_type: grid
      label: "Grid Spot"
    params:
      grid_levels: 15
      grid_spacing_pct: 1.5
      range_size_pct: 40.0
      rebalance_threshold_pct: 12.0
      order_amount_usdc: 20

  - name: trend_following
    enabled: true
    bot_id: trend_following_prod
    budget:
      max_open_positions: 1
      daily_loss_limit_eur: 15.0
      max_position_pct: 30.0
      position_size_multiplier: 2.0
    dashboard:
      exit_type: trailing_stop
      label: "Trend Following"
    params:
      ema_fast_period: 20
      ema_slow_period: 50
      trailing_stop_pct: 6.0
      trailing_activation_pct: 3.0
      take_profit_pct: 25.0
      max_holding_days: 30
      hard_stop_below_ema50: true
      min_cross_strength_pct: 0.1

  - name: grid_adaptive
    enabled: true
    bot_id: grid_adaptive_prod
    budget:
      max_open_positions: 8
      daily_loss_limit_eur: 10.0
      max_position_pct: 30.0
      position_size_multiplier: 1.0
    dashboard:
      exit_type: grid
      label: "Grid Adaptive"
    params:
      grid_levels: 8
      atr_multiplier: 3.0
      recalculate_hours: 6
      order_amount_usdc: 25
      min_spacing_pct: 1.5
      max_spacing_pct: 4.0
      directional_pause_pct: 25.0
      allow_short: false

  # === DESACTIVEES (gardees pour backtest/reference) ===
  - name: adaptive
    enabled: false
    bot_id: adaptive_prod
    budget:
      max_open_positions: 7
      daily_loss_limit_eur: 20.0
      max_position_pct: 15.0
      position_size_multiplier: 1.0
    dashboard:
      exit_type: trailing_stop
      label: "Adaptive"
    params:
      trailing_stop_pct: 3.0
      min_profit_for_trailing_pct: 1.0
      min_volume_ratio: 1.2
      block_overbought_15m: true
      neutral_min_drop_pct: 4.0

  - name: capitulation
    enabled: false
    bot_id: capitulation_prod
    budget:
      max_open_positions: 3
      daily_loss_limit_eur: 10.0
      max_position_pct: 15.0
      position_size_multiplier: 2.0
    dashboard:
      exit_type: profit_target
      label: "Capitulation"
    params:
      rsi_1h_threshold: 20.0
      rsi_5m_threshold: 15.0
      volume_spike_multiplier: 3.0
      trailing_stop_pct: 5.0
      max_profit_target_pct: 10.0
      max_holding_minutes: 2880
      cooldown_hours: 4

  - name: bear_short
    enabled: false
    bot_id: bear_short_prod
    budget:
      max_open_positions: 2
      daily_loss_limit_eur: 15.0
      max_position_pct: 10.0
      position_size_multiplier: 1.0
    dashboard:
      exit_type: trailing_stop
      label: "Bear Short"
    params:
      active_regimes: [BEAR, STRONG_BEAR]
      leverage: 2
      profit_target_bear_pct: 2.0
      profit_target_strong_bear_pct: 3.0
      stop_loss_pct: 2.0
      trailing_stop_pct: 1.0
      min_profit_for_trailing_pct: 1.5
      max_holding_hours: 48
      rsi_15m_min_entry: 60
