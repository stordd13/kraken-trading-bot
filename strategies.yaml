# Multi-Strategy Configuration
# If this file exists and enabled: true, the bot runs in multi-strategy mode.
# If this file is missing or enabled: false, the bot runs in legacy single-strategy mode.

enabled: true

# Active operating profile for the next deployment wave.
deployment_profile:
  name: multi-pair-v1
  trading_pairs: [BTC/USDC, ETH/USDC, SOL/USDC]
  initial_capital_usdc: 1000
  paper_days: 7
  micro_live_days: 14
  scale_review_day: 21
  manual_reviews_per_day: 2

# Global limits (across ALL strategies combined)
global_max_open_positions: 8
global_daily_loss_limit_eur: 15.0
global_max_portfolio_exposure_pct: 25.0

# Common technical indicators - shared data layer across all strategies
# These defaults are used by the MultiTimeframeAnalyzer generic registry.
common_indicators:
  timeframes: ["5m", "15m", "1h", "4h", "1d", "1w"]
  ema_fast_period: 20
  ema_slow_period: 50
  rsi_default_period: 14
  atr_default_period: 14
  bb_default_period: 20
  adx_period: 14

# ML pipeline configuration (LightGBM enhancer overlay)
# When enabled: false, the bot operates in pure rule-based mode.
ml:
  enabled: false
  mode: "enhancer"
  confidence_threshold: 0.62
  retrain_every: "30d"
  fallback_on_error: true
  models_dir: "models/"
  features:
    lookback_candles: 240
    external_data: true
    fear_greed_api: "https://api.alternative.me/fng/"

strategies:
  # =============================================================
  # === NEW: Multi-Strategy Router (7 strategies + risk manager)
  # =============================================================
  - name: multi_strategy_router
    enabled: true
    bot_id: multi_router
    budget:
      max_open_positions: 8
      daily_loss_limit_eur: 15.0
      max_position_pct: 25.0
      position_size_multiplier: 1.0
    dashboard:
      exit_type: mixed
      label: "Multi Router"
    params:
      capital_usdc: 1000

      # GeminiGlobalRiskManager config
      risk:
        risk_per_trade_pct: 1.0
        atr_sl_multiplier: 3.0
        atr_sl_timeframe: "4h"
        atr_sl_period: 14
        crash_threshold_pct: 7.0
        crash_window_min: 30
        crash_close_pct: 0.5
        crash_suspend_hours: 2

      # ---------------------------------------------------------------
      # Inner strategies — multi-pair capable
      # Use 'class' field when YAML key differs from strategy class name
      # (e.g., grid_atr_btc → class: grok_grid_atr_adaptive_v4)
      # 'pair' inside params sets which pair this instance trades.
      # ---------------------------------------------------------------
      strategies:
        # === BTC/USDC strategies (active) ===

        grid_atr_btc:
          active: true
          class: grok_grid_atr_adaptive_v4
          bot_id: grid_atr_v4
          params:
            pair: BTC/USDC
            grid_levels: 12
            min_spacing_pct: 0.015
            max_spacing_pct: 0.05
            atr_period: 14
            atr_multiplier: 4.0
            recalc_hours: 6
            order_size_usdc: 10
            max_allocation_pct: 10.0
            bias_1d: 0.2
            pause_1w_strong_bear: true

        supertrend_btc:
          active: true
          class: grok_supertrend_4h
          bot_id: supertrend_4h
          params:
            pair: BTC/USDC
            st_atr_period: 10
            st_multiplier: 3.0
            sl_atr_mult: 3.5
            max_allocation_pct: 10.0

        ema_cross_btc:
          active: false  # Hold until post-J30 review
          class: grok_ema_adx_atr
          bot_id: ema_cross_4h
          params:
            pair: BTC/USDC
            ema_fast: 20
            ema_slow: 50
            adx_threshold: 14
            atr_mult_stop: 3.5
            breakeven_atr: 1.5
            trailing_atr: 3.0
            max_allocation_pct: 15.0

        dca_btc:
          active: false  # Hold until post-J30 review
          class: grok_adaptive_dca_weekly
          bot_id: dca_weekly
          params:
            pair: BTC/USDC
            base_amount_usdc: 15
            oversold_multiplier: 2.5
            bull_reduction: 0.5
            rsi_oversold: 30
            max_allocation_pct: 25.0

        donchian_btc:
          active: true
          class: grok_donchian_breakout_4h
          bot_id: donchian_btc
          params:
            pair: BTC/USDC
            period_upper: 20
            period_lower: 10
            sl_atr_mult: 3.5
            adx_threshold: 18
            order_size_usdc: 30
            max_allocation_pct: 10.0

        # === ETH/USDC strategies (inactive by default — enable after P6 backtests) ===

        grid_atr_eth:
          active: false
          class: grok_grid_atr_adaptive_v4
          bot_id: grid_atr_v4_eth
          params:
            pair: ETH/USDC
            grid_levels: 12
            min_spacing_pct: 0.015
            max_spacing_pct: 0.05
            atr_period: 14
            atr_multiplier: 4.0
            recalc_hours: 6
            order_size_usdc: 25
            max_allocation_pct: 10.0

        supertrend_eth:
          active: false
          class: grok_supertrend_4h
          bot_id: supertrend_4h_eth
          params:
            pair: ETH/USDC
            st_atr_period: 10
            st_multiplier: 3.0
            sl_atr_mult: 3.5
            max_allocation_pct: 8.0

        donchian_eth:
          active: false
          class: grok_donchian_breakout_4h
          bot_id: donchian_eth
          params:
            pair: ETH/USDC
            period_upper: 20
            period_lower: 10
            sl_atr_mult: 3.5
            adx_threshold: 18
            max_allocation_pct: 8.0

        # === SOL/USDC strategies (inactive by default) ===

        supertrend_sol:
          active: false
          class: grok_supertrend_4h
          bot_id: supertrend_4h_sol
          params:
            pair: SOL/USDC
            st_atr_period: 10
            st_multiplier: 3.0
            sl_atr_mult: 3.5
            max_allocation_pct: 8.0

        donchian_sol:
          active: false
          class: grok_donchian_breakout_4h
          bot_id: donchian_sol
          params:
            pair: SOL/USDC
            period_upper: 20
            period_lower: 10
            sl_atr_mult: 3.5
            adx_threshold: 18
            max_allocation_pct: 8.0

        # === KILLED strategies (kept for reference) ===

        gemini_scalping_volatilite:
          active: false  # KILL Phase 1A: -14.8%, PF 0.86
          bot_id: scalping_vol
          params:
            pair: BTC/USDC
            rsi_period: 7
            rsi_oversold: 30
            sl_atr_mult: 1.5
            tp_atr_mult: 1.0
            trail_activation_atr: 0.5
            trail_atr_mult: 1.0
            order_size_usdc: 25
            max_allocation_pct: 10.0
            max_open_positions: 2
            close_hour_utc: 23

        gemini_suivi_tendance_momentum:
          active: false  # KILL Phase 1A: -19.3%, pullback bug
          bot_id: tendance_mom
          params:
            pair: BTC/USDC
            adx_min: 20
            initial_sl_atr_mult: 2.5
            trailing_atr_mult: 2.0
            order_size_usdc: 50
            max_allocation_pct: 15.0
            max_open_positions: 1

        gemini_retour_moyenne:
          active: false  # KILL Phase 1A: -8.5%, DCA into falling knife
          bot_id: retour_moy
          params:
            pair: BTC/USDC
            dca_levels: 3
            dca_spacing_pct: 0.5
            sl_atr_mult: 2.0
            order_size_usdc: 20
            max_allocation_pct: 10.0
            max_open_positions: 2
